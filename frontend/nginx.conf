server {
  listen 80;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # sourcemap（hidden 模式）随镜像分发供运维排错，但不对访客开放
  location ~* \.map$ {
    return 404;
  }

  # Proxy API requests to backend container
  location /api {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # API 响应与静态资源同样补基础安全头；always 保证 4xx/5xx 也带上。
    # HSTS 在 TLS 终止层（宿主 Caddy）加，HTTP 明文响应加 HSTS 会被浏览器忽略
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location /docs {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location /redoc {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # Vite 打包的 /assets/ 文件名含 hash，永久缓存
  location /assets/ {
    root /usr/share/nginx/html;
    expires max;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;

    # index.html 不缓存，保证部署后用户拿到新版本
    add_header Cache-Control "no-cache";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 强制。唯一放行的内联脚本是 index.html 的主题防闪白脚本，hash 基于构建
    # 产物字节（浏览器哈希前剥首尾空白）；改主题脚本须重算并同步此值——
    # frontend/scripts/check-csp-hash.sh 在 CI 校验漂移。access token 存
    # localStorage，CSP 是主要 XSS 缓解层。connect-src 放行自建 GlitchTip 上报
    # 域（$GLITCHTIP_ORIGIN，Dockerfile 构建期 envsubst 注入；未配置时为空，
    # 仅放行 self）。不用 Sentry 云。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-HMbYPowcPpK3t5dgjj/FGeOZ4jOtNWkdCdLJJGS/bHw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ${GLITCHTIP_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
  }
}
