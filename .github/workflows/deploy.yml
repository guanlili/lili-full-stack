name: CI & Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  backend:
    name: 后端 Lint + 测试
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1025:1025
    env:
      # 覆盖 .env 中面向 docker 网络的配置，CI 里服务都在 localhost
      POSTGRES_SERVER: localhost
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: noreply@example.com
    steps:
      - uses: actions/checkout@v7
      - name: 校验 .env.example 与 deploy.yml 写入的键一致
        run: |
          if ! diff <(grep -oE '^[A-Z_]+=' .env.example | sort) \
                    <(grep -oE 'echo "[A-Z_]+=' .github/workflows/deploy.yml | grep -oE '[A-Z_]+=' | sort); then
            echo "❌ .env.example 与 deploy.yml「写入 .env」段落的环境变量键不一致。"
            echo "   新增/删除配置项时必须两边同步，否则该变量在生产上是空值（静默失效）。"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v7
      - name: 准备环境变量
        run: cp .env.example .env
      - name: 安装依赖
        run: uv sync
      - name: Lint（ty + ruff）
        working-directory: backend
        run: uv run bash scripts/lint.sh
      - name: 数据库迁移 + 初始数据
        working-directory: backend
        run: uv run bash scripts/prestart.sh
      - name: 运行测试
        working-directory: backend
        run: uv run bash scripts/tests-start.sh

  frontend:
    name: 前端 Lint + 构建 + 客户端一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: Biome 检查
        working-directory: frontend
        run: npx biome ci .
      - name: 类型检查 + 构建
        working-directory: frontend
        run: npm run build
      # 校验 src/client/ 与后端 OpenAPI 一致：后端接口改了但忘记 generate-client 时在这里拦下
      - uses: astral-sh/setup-uv@v7
      - name: 准备环境变量（导入 app 需要）
        run: cp .env.example .env
      - name: 导出后端 OpenAPI 规范
        working-directory: backend
        run: uv run python -c "import json, app.main; print(json.dumps(app.main.app.openapi()))" > ../frontend/openapi.json
      - name: 校验前端客户端无漂移
        working-directory: frontend
        run: |
          npx openapi-ts
          if [ -n "$(git status --porcelain src/client/)" ]; then
            git status --porcelain src/client/
            git --no-pager diff src/client/ | head -100
            echo "❌ 前端 src/client/ 与后端 OpenAPI 不一致（后端接口改动后未重新生成客户端）。"
            echo "   修复：docker compose up -d 后执行 cd frontend && npm run generate-client，提交 src/client/ 的变更。"
            exit 1
          fi

  deploy:
    name: 部署到服务器
    needs: [backend, frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 服务器拉代码并重启服务
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== 1/4 checkout 到本次 CI 验证过的提交 ==="
            # 不用 git pull：pull 拿到的是"部署时刻的最新 master"，连续 push 时可能部署到还没过 CI 的提交。
            # reset --hard 到 github.sha 保证部署的永远是这个 run 测过的代码，也兼容紧急回滚后的服务器状态。
            git fetch origin
            git reset --hard ${{ github.sha }}

            # 注意：下方键列表必须与 .env.example 保持一致（CI 的键校验步骤会拦截不一致）
            echo "=== 2/4 写入 .env（以 Secrets 为准）==="
            {
              echo "FRONTEND_HOST=${{ secrets.FRONTEND_HOST }}"
              echo "ENVIRONMENT=production"
              echo "PROJECT_NAME=${{ secrets.PROJECT_NAME }}"
              echo "BACKEND_CORS_ORIGINS=${{ secrets.FRONTEND_HOST }}"
              echo "SECRET_KEY=${{ secrets.SECRET_KEY }}"
              echo "FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}"
              echo "FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}"
              echo "SMTP_HOST="
              echo "SMTP_USER="
              echo "SMTP_PASSWORD="
              echo "EMAILS_FROM_EMAIL=info@example.com"
              echo "SMTP_TLS=True"
              echo "SMTP_SSL=False"
              echo "SMTP_PORT=587"
              echo "POSTGRES_SERVER=db"
              echo "POSTGRES_PORT=5432"
              echo "POSTGRES_DB=app"
              echo "POSTGRES_USER=postgres"
              echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
              echo "SENTRY_DSN="
              echo "APP_PORT=${{ secrets.APP_PORT }}"
              echo "WORKERS=${{ secrets.WORKERS || '1' }}"
            } > .env

            echo "=== 3/4 构建并重启容器 ==="
            docker compose -f compose.yml up -d --build --remove-orphans || {
              echo "--- prestart logs ---"
              docker compose -f compose.yml logs prestart --tail 50
              echo "--- backend logs ---"
              docker compose -f compose.yml logs backend --tail 50
              exit 1
            }

            echo "=== 4/4 验证（经 nginx 反代访问后端健康检查）==="
            healthy=""
            for i in $(seq 1 30); do
              if curl -fsS "http://localhost:${{ secrets.APP_PORT }}/api/v1/utils/health-check/" > /dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "❌ 健康检查 60 秒内未通过"
              docker compose -f compose.yml ps
              docker compose -f compose.yml logs backend --tail 50
              exit 1
            fi
            echo "✅ 部署成功"
            docker compose -f compose.yml ps

            echo "=== 清理旧镜像，防止磁盘被悬空镜像占满 ==="
            docker image prune -f
