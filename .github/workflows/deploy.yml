name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 服务器拉代码并重启服务
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== 1/3 拉最新代码 ==="
            git pull --ff-only

            echo "=== 1.5/3 确保 .env 存在 ==="
            if [ ! -f .env ]; then
              echo ".env 不存在，创建默认生产配置..."
              {
                echo 'FRONTEND_HOST=http://42.193.108.162:8082'
                echo 'ENVIRONMENT=production'
                echo 'PROJECT_NAME=My Project'
                echo 'BACKEND_CORS_ORIGINS=http://42.193.108.162:8082'
                echo 'SECRET_KEY=changethis'
                echo 'FIRST_SUPERUSER=admin@example.com'
                echo 'FIRST_SUPERUSER_PASSWORD=Lili2026!'
                echo 'SMTP_HOST='
                echo 'SMTP_USER='
                echo 'SMTP_PASSWORD='
                echo 'EMAILS_FROM_EMAIL=info@example.com'
                echo 'SMTP_TLS=True'
                echo 'SMTP_SSL=False'
                echo 'SMTP_PORT=587'
                echo 'POSTGRES_SERVER=db'
                echo 'POSTGRES_PORT=5432'
                echo 'POSTGRES_DB=app'
                echo 'POSTGRES_USER=postgres'
                echo 'POSTGRES_PASSWORD=LiliDB2026!'
                echo 'SENTRY_DSN='
                echo 'APP_PORT=8082'
              } > .env
            fi

            echo "=== 2/3 构建并重启容器 ==="
            docker compose -f compose.yml up -d --build || {
              echo "--- prestart logs ---"
              docker compose -f compose.yml logs prestart --tail 50
              exit 1
            }

            echo "=== 3/3 验证 ==="
            sleep 8
            docker compose -f compose.yml ps
